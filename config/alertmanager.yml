global:
  smtp_smarthost: 'smtp.gmail.com:587'
  smtp_from: 'thedbadmin.test@gmail.com'
  smtp_auth_username: 'thedbadmin.test@gmail.com'
  smtp_auth_password: 'YOUR_GMAIL_APP_PASSWORD'   # <-- Replace with your Gmail App Password
  smtp_require_tls: true

route:
  receiver: "email-alert"
  group_wait: 30s           # Wait 30s before sending first alert (groups multiple alerts)
  group_interval: 5m        # Wait 5m before sending new alerts for an existing group
  repeat_interval: 4h       # Resend alert if still firing after 4h

receivers:
  - name: "email-alert"
    email_configs:
      - to: "thedbadmin.test@gmail.com"   # <-- Change to your alert recipient email
        send_resolved: true               # Send email when alert is resolved
        headers:
          subject: '[{{ .Status | toUpper }}] {{ .GroupLabels.alertname }} - PostgreSQL Monitor'
