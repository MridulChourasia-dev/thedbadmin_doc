groups:
  - name: system-alerts
    rules:

      # -------------------------------------------------------
      # Instance Down
      # Fires when any monitored target stops responding
      # -------------------------------------------------------
      - alert: InstanceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Instance {{ $labels.instance }} is DOWN"
          description: "Target {{ $labels.job }} / {{ $labels.instance }} has been unreachable for more than 1 minute."

      # -------------------------------------------------------
      # High CPU Usage
      # Fires when CPU usage exceeds 80% for 2 minutes
      # NOTE: Threshold is set to 80% (production-safe value).
      #       Lower it to 20% in test/dev if needed.
      # -------------------------------------------------------
      - alert: HighCPUUsage
        expr: 100 - (avg by(instance)(rate(node_cpu_seconds_total{mode="idle"}[1m])) * 100) > 80
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage on {{ $labels.instance }}"
          description: "CPU usage is above 80% on {{ $labels.instance }} for more than 2 minutes. Current value: {{ $value | printf \"%.1f\" }}%"

      # -------------------------------------------------------
      # High Memory Usage
      # Fires when available RAM drops below 10%
      # -------------------------------------------------------
      - alert: HighMemoryUsage
        expr: (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 < 10
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Low available memory on {{ $labels.instance }}"
          description: "Available memory is below 10% on {{ $labels.instance }}. Available: {{ $value | printf \"%.1f\" }}%"

      # -------------------------------------------------------
      # Disk Space Low
      # Fires when disk usage exceeds 85%
      # -------------------------------------------------------
      - alert: DiskSpaceLow
        expr: (1 - (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes)) * 100 > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Disk space low on {{ $labels.instance }}"
          description: "Disk usage on {{ $labels.instance }} ({{ $labels.mountpoint }}) is above 85%. Current: {{ $value | printf \"%.1f\" }}%"

      # -------------------------------------------------------
      # PostgreSQL Down
      # Fires when postgres_exporter loses connection to Postgres
      # -------------------------------------------------------
      - alert: PostgreSQLDown
        expr: pg_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL is DOWN on {{ $labels.instance }}"
          description: "postgres_exporter cannot connect to PostgreSQL on {{ $labels.instance }} for more than 1 minute."

      # -------------------------------------------------------
      # PostgreSQL Too Many Connections
      # Fires when connections exceed 80% of max_connections
      # -------------------------------------------------------
      - alert: PostgreSQLTooManyConnections
        expr: sum by(instance) (pg_stat_activity_count) > (pg_settings_max_connections * 0.8)
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL high connection count on {{ $labels.instance }}"
          description: "PostgreSQL connections on {{ $labels.instance }} exceed 80% of max_connections."
